clustering:
  # k=4 locked for production stability (derived from silhouette analysis & business segments)
  experiment_name: "customer_segmentation"
  feature_version: "clustering_v1"
  features: ["recency", "frequency", "avg_order_value"]
  cluster_range: [4]
  random_state: 42
  test_size: 0.2

churn:
  experiment_name: "customer_churn"
  feature_version: "churn_v1"
  cutoff_days: 90
  test_size: 0.2
  random_state: 42
  classification_threshold: 0.40
  auto_optimize_threshold: true
  features:
    - "recency"
    - "frequency"
    - "avg_order_value"
    - "spending_velocity"
    - "cancellation_rate"
    - "preferred_shopping_hour"


