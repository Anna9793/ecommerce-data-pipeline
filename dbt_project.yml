name: 'ecommerce_dbt_pipeline'
version: '1.0.0'
config-version: 2

profile: 'ecommerce_bigquery_profile'

model-paths: ["dbt_models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  ecommerce_dbt_pipeline:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts
      +tags: ["marts", "daily", "rfm"]
