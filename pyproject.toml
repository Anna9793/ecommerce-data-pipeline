[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-data-pipeline"
version = "0.1.0"
description = "Enterprise Multi-Tenant E-Commerce Data Engineering, MLOps, and Real-Time GenAI Intelligence Platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Anna", email = "anna@example.com" }
]
keywords = [
    "data-engineering",
    "gcp",
    "bigquery",
    "vertex-ai",
    "mlops",
    "realtime-analytics",
    "langgraph",
    "genai"
]

dependencies = [
    # Core Web & API
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "streamlit>=1.31.0",
    "plotly>=5.18.0",
    
    # Data Science & ML Core
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
    "openpyxl>=3.1.0",
    "mlflow>=2.10.0",
    
    # Google Cloud Platform & Serverless
    "google-cloud-bigquery>=3.14.0",
    "pandas-gbq>=0.20.0",
    "google-cloud-storage>=2.14.0",
    "gcsfs>=2023.12.0",
    "google-cloud-aiplatform>=1.38.0",
    "kfp>=2.7.0",
    "google-cloud-firestore>=2.14.0",
    "google-cloud-pubsub>=2.18.0",
    
    # GenAI & Agentic Systems
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    
    # Storage & Connectors
    "psycopg2-binary>=2.9.9",
    "SQLAlchemy>=2.0.25",
    
    # Utilities
    "requests>=2.31.0",
    "httpx>=0.26.0",
    "PyYAML>=6.0.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
]

orchestration = [
    "apache-airflow>=2.8.0",
    "apache-airflow-providers-google>=10.10.0",
    "apache-beam[gcp]>=2.55.0",
]

ml = [
    "mlflow>=2.10.0",
    "scikit-learn>=1.4.0",
    "google-cloud-aiplatform>=1.38.0",
    "kfp>=2.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
